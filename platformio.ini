; ==========================================================================
;  Proyek telemetri IMU pelari - nRF24L01
;  Satu proyek, tiga environment:
;    ground_station : ESP32 DevKitC v4        -> src/ground_station/
;    node1 / node2  : ESP32-C3 SuperMini      -> src/node/  (NODE_ID lewat build flag)
;
;  Build/upload di VSCode: klik ikon PlatformIO -> pilih environment -> Upload
;  Atau terminal:
;    pio run -e ground_station -t upload
;    pio run -e node1 -t upload
;    pio run -e node2 -t upload
; ==========================================================================

[platformio]
default_envs = ground_station

; ---------------- pengaturan bersama ----------------
[env]
platform  = espressif32
framework = arduino
lib_deps =
    nrf24/RF24 @ ^1.4.10
build_flags =
    -Wall
monitor_filters = esp32_exception_decoder, time

; ---------------- Ground Station ----------------
[env:ground_station]
board = esp32dev
build_src_filter = +<ground_station/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.2.1
upload_speed  = 921600
monitor_speed = 921600
; Serial Monitor PlatformIO dan gs_debug.py tidak bisa dipakai bersamaan (satu port satu program)

; ---------------- Diagnosis nRF24 di Ground Station ----------------
; pio run -e gs_diag -t upload  lalu  pio device monitor -e gs_diag
; (selesai: upload lagi env ground_station)
[env:gs_diag]
board = esp32dev
build_src_filter = +<diag_nrf/>
lib_deps = ${env:ground_station.lib_deps}
upload_speed  = 921600
monitor_speed = 115200

; ---------------- Node (dasar) ----------------
[node_common]
board = esp32-c3-devkitm-1
build_src_filter = +<node/>
; model EBM (src/node/ebm_model.h) bisa ratusan KB: app 3 MB tanpa OTA (NVS/kalibrasi tetap)
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Serial lewat USB native, GPIO20/21 bebas
upload_speed  = 921600
monitor_speed = 115200

[env:node1]
extends = node_common
build_flags =
    ${node_common.build_flags}
    -DNODE_ID=1

[env:node2]
extends = node_common
build_flags =
    ${node_common.build_flags}
    -DNODE_ID=2